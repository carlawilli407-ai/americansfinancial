<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Financial planning roadmap illustration">
  <defs>
    <linearGradient id="planGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#368727"/>
      <stop offset="1" stop-color="#0F5319"/>
    </linearGradient>
  </defs>
  <!-- road -->
  <path d="M10 120 Q80 100 160 105 Q240 110 310 95" fill="none" stroke="#d9d8d5" stroke-width="3" stroke-linecap="round"/>
  <!-- milestones -->
  <circle cx="60" cy="105" r="12" fill="#e7f3ec" stroke="#0F5319" stroke-width="2"/>
  <text x="60" y="109" text-anchor="middle" font-size="10" fill="#0F5319" font-weight="700">1</text>
  <circle cx="160" cy="103" r="12" fill="#e7f3ec" stroke="#0F5319" stroke-width="2"/>
  <text x="160" y="107" text-anchor="middle" font-size="10" fill="#0F5319" font-weight="700">2</text>
  <circle cx="260" cy="95" r="12" fill="#e7f3ec" border="#0F5319" stroke-width="2"/>
  <text x="260" y="99" text-anchor="middle" font-size="10" fill="#0F5319" font-weight="700">3</text>
  <!-- goal labels -->
  <rect x="38" y="70" width="44" height="10" rx="2" fill="#d9d9d9"/>
  <rect x="138" y="68" width="44" height="10" rx="2" fill="#d9d9d9"/>
  <rect x="238" y="58" width="44" height="10" rx="2" fill="#d9d9d9"/>
  <!-- progress bars -->
  <rect x="38" y="90" width="44" height="4" rx="2" fill="#e7f3ec"/>
  <rect x="38" y="90" width="26" height="4" rx="2" fill="#0F5319"/>
  <rect x="138" y="88" width="44" height="4" rx="2" fill="#e7f3ec"/>
  <rect x="138" y="88" width="18" height="4" rx="2" fill="#0F5319"/>
  <rect x="238" y="78" width="44" height="4" rx="2" fill="#e7f3ec"/>
  <rect x="238" y="78" width="36" height="4" rx="2" fill="#0F5319"/>
  <!-- current position dot -->
  <circle cx="160" cy="103" r="4" fill="#0F5319" stroke="#fff" stroke-width="2"/>
</svg>
