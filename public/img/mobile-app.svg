<svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mobile app showing American Financial Associates dashboard">
  <!-- phone body -->
  <rect x="40" y="10" width="120" height="380" rx="22" ry="22" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <!-- screen -->
  <rect x="46" y="16" width="108" height="368" rx="16" ry="16" fill="#f8f9fa"/>
  <!-- status bar -->
  <rect x="50" y="20" width="100" height="10" rx="5" fill="#333"/>
  <!-- header -->
  <rect x="50" y="36" width="60" height="10" rx="5" fill="#0F5319"/>
  <!-- portfolio value -->
  <rect x="50" y="54" width="70" height="6" rx="3" fill="#d9d9d9"/>
  <!-- chart area -->
  <rect x="50" y="70" width="100" height="50" rx="4" fill="#fff" stroke="#eee" stroke-width="1"/>
  <polyline points="58,110 70,95 82,105 94,90 106,100 114,92" fill="none" stroke="#0F5319" stroke-width="1.5"/>
  <!-- account cards -->
  <rect x="50" y="130" width="100" height="26" rx="4" fill="#e7f3ec" stroke="#bff0cd" stroke-width="1"/>
  <rect x="50" y="162" width="70" height="8" rx="4" fill="#d9d9d9"/>
  <rect x="50" y="176" width="100" height="26" rx="4" fill="#fff" stroke="#eee" stroke-width="1"/>
  <rect x="50" y="208" width="70" height="8" rx="4" fill="#d9d9d9"/>
  <!-- nav icons -->
  <circle cx="66" cy="320" r="5" fill="#0F5319"/>
  <circle cx="82" cy="320" r="5" fill="#aaa"/>
  <circle cx="98" cy="320" r="5" fill="#aaa"/>
  <circle cx="114" cy="320" r="5" fill="#aaa"/>
  <circle cx="130" cy="320" r="5" fill="#aaa"/>
</svg>
