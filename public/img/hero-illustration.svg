<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" role="img" aria-label="Preview of your American Financial Associates dashboard">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#368727"/>
      <stop offset="1" stop-color="#0F5319"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#368727" stop-opacity=".35"/>
      <stop offset="1" stop-color="#368727" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a655a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#368727" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="440" height="380" fill="url(#glow)"/>
  <circle cx="380" cy="70" r="86" fill="#0a655a" opacity=".10"/>
  <circle cx="64" cy="318" r="64" fill="#368727" opacity=".10"/>
  <!-- phone card -->
  <rect x="118" y="36" width="246" height="308" rx="24" fill="#ffffff" stroke="#e3e9e4" stroke-width="2"/>
  <path d="M118 60 a24 24 0 0 1 24 -24 h198 a24 24 0 0 1 24 24 v14 h-246 z" fill="url(#hdr)"/>
  <circle cx="146" cy="63" r="7" fill="#ffffff" opacity=".92"/>
  <rect x="162" y="58" width="96" height="10" rx="5" fill="#ffffff" opacity=".85"/>
