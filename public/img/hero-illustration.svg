  <polygon points="146,256 180,236 214,248 248,214 282,226 316,190 350,202 350,272 146,272" fill="url(#fill)"/>
  <polyline points="146,256 180,236 214,248 248,214 282,226 316,190 350,202" fill="none" stroke="#368727" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="316" cy="190" r="6" fill="#0F5319" stroke="#fff" stroke-width="2"/>
  <!-- coin stack -->
